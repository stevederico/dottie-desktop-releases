			shellScript = "# Set executable permissions on shell scripts\nif [ -d \"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/gateway\" ]; then\n    chmod +x \"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/gateway/scripts\"/*.sh\n    echo \"Set executable permissions on shell scripts\"\nfi\n";
